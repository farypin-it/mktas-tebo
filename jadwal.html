<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jadwal Lengkap - SIM MKTAS</title>
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function() {
      try {
        var s = JSON.parse(localStorage.getItem('mktas_settings') || '{}');
        var r = document.documentElement;
        var p = s.warna_primer || '#6366f1';
        var h = s.warna_hover || '#4f46e5';
        var a1 = s.warna_aksen1 || '#10b981';
        var a2 = s.warna_aksen2 || '#ec4899';
        r.style.setProperty('--primary-color', p);
        r.style.setProperty('--primary-hover', h);
        r.style.setProperty('--accent-color', a1);
        r.style.setProperty('--secondary-color', a2);
        r.style.setProperty('--gradient-primary', 'linear-gradient(135deg, ' + p + ' 0%, ' + a2 + ' 100%)');
        r.style.setProperty('--gradient-hover', 'linear-gradient(135deg, ' + h + ' 0%, ' + a1 + ' 100%)');
        r.style.setProperty('--gradient-sidebar', 'linear-gradient(180deg, ' + p + ' 0%, ' + a2 + ' 100%)');
        r.style.setProperty('--gradient-accent', 'linear-gradient(135deg, ' + p + ' 0%, ' + a1 + ' 100%)');
        r.style.setProperty('--gradient-text', 'linear-gradient(135deg, ' + p + ' 0%, ' + a2 + ' 100%)');
      } catch(e) {}
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html {
      scroll-behavior: smooth;
    }
    .btn-scroll-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--gradient-primary, var(--primary-color));
      color: #ffffff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-scroll-top.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .btn-scroll-top:hover {
      background: var(--gradient-hover, var(--primary-hover, #4338ca));
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }
    .public-footer {
      background: #1f2937;
      color: white;
      padding: 40px 0 20px;
      margin-top: auto;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.6fr 1.1fr 1fr;
      gap: 24px;
      margin-bottom: 25px;
      align-items: start;
    }

    .footer-col:nth-child(3) {
      text-align: right;
    }

    .footer-col:nth-child(3) .social-links {
      justify-content: flex-end;
    }

    .footer-col h4 {
      color: white;
      margin-bottom: 15px;
    }

    .social-links a {
      color: white;
      font-size: 1.5rem;
      margin-right: 15px;
      transition: var(--transition);
    }

    .social-links a:hover {
      color: var(--primary-color);
    }


  </style>
</head>

  <main class="container" style="flex: 1; padding-top: 30px; padding-bottom: 50px;">
    <h2
      style="border-bottom: 2px solid var(--primary-color); display: inline-block; padding-bottom: 5px; margin-bottom: 20px;">
      Jadwal Kegiatan Terlaksana</h2>

    <div style="margin-bottom: 15px;">

    </div>

    <div class="table-container" style="background: white; border-radius: var(--card-radius); padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto;">
      <table id="table-jadwal" style="width: 100%; border-collapse: collapse;">

    <div id="jadwal-year-pagination" style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:20px; padding: 12px 14px; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
      <button id="btn-prev-year" type="button" class="btn btn-outline" style="min-width:120px;">Sebelumnya</button>
      <div id="text-year-page" style="font-weight:700; color: var(--text-dark); text-align:center;">Tahun</div>

  <!-- Popup Modal untuk Slider Foto Kegiatan -->
  <div class="modal" id="modal-foto-kegiatan" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8);">
    <div class="modal-content" style="background-color: #fff; margin: 5% auto; padding: 20px; width: 90%; max-width: 800px; border-radius: 12px; position: relative;">
      <span class="close-btn" onclick="document.getElementById('modal-foto-kegiatan').style.display='none'" style="position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer;">&times;</span>
      <h3 style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">Foto Kegiatan</h3>
      <div id="foto-kegiatan-container" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-height: 70vh; overflow-y: auto;">
        <!-- Images injected here -->
      </div>
    </div>

  <script src="js/api.js"></script>
  <script src="js/footer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let localSet = JSON.parse(localStorage.getItem('mktas_settings') || '{}');
      try {
        if (typeof fetchAPI !== 'undefined') {
          const res = await fetchAPI('getSettings', {});
          if (res && res.status === 'success' && res.data) {
              localSet = typeof mergeSettings === 'function' ? mergeSettings(localSet, res.data) : Object.assign(localSet, res.data);
          }
        }
      } catch (e) {}

      if (typeof applyWarnaSettings === 'function') {
        applyWarnaSettings(localSet);
      }

      // Populate Header & Footer Branding
      if (localSet.wilayah) {
        const hw = document.getElementById('header-wilayah');
        if (hw) hw.textContent = localSet.wilayah;
        const fr = document.getElementById('footer-region');
        if (fr) fr.textContent = localSet.wilayah;
      }
      if (localSet.nama_forum) {
        const fn = document.getElementById('footer-forum-name');
        if (fn) fn.textContent = localSet.nama_forum;
      }
      if (localSet.singkatan_forum) {
        const fc = document.getElementById('footer-copyright-name');
        if (fc) fc.textContent = localSet.singkatan_forum;
      }
      if (localSet.alamat) {
        const fa = document.getElementById('footer-address');
        if (fa) fa.textContent = localSet.alamat;
      }
      if (localSet.telp) {
        const fp = document.getElementById('footer-phone');
        if (fp) fp.textContent = localSet.telp;
        let cleanTelp = String(localSet.telp).replace(/[^0-9]/g, '');
        if (cleanTelp.startsWith('0')) cleanTelp = '62' + cleanTelp.substring(1);
        const fpl = document.getElementById('footer-phone-link');
        if (fpl) fpl.href = 'https://wa.me/' + cleanTelp;
      }
      if (localSet.email) {
        const fe = document.getElementById('footer-email');
        if (fe) fe.textContent = localSet.email;
        const fel = document.getElementById('footer-email-link');
        if (fel) fel.href = 'mailto:' + localSet.email;
      }
      if (localSet.website) {
        const fw = document.getElementById('footer-website');
        if (fw) {
          const website = String(localSet.website);
          fw.textContent = website.replace(/^https?:\/\//, '');
          fw.href = website.startsWith('http') ? website : 'https://' + website;
        }
      }
      if (localSet.logo_forum) {
        const fl = document.getElementById('footer-logo');
        if (fl) { fl.src = localSet.logo_forum; fl.style.display = 'block'; }
        const hl = document.getElementById('header-logo-img');
        if (hl) { hl.src = localSet.logo_forum; hl.style.display = 'block'; }
        const hs = document.getElementById('header-logo-svg');
        if (hs) hs.style.display = 'none';
      }

      // Load Schedules
      const tbody = document.querySelector('#table-jadwal tbody');
      let cachedSchedules = [];
      let cachedKoordMap = {};
      
      try {
        cachedSchedules = JSON.parse(localStorage.getItem('mktas_schedules') || '[]');
        cachedKoordMap = JSON.parse(localStorage.getItem('mktas_koordmap') || '{}');
      } catch (e) {}

      let allPastSchedules = [];
      let currentYearPage = 1;

      function formatBulan(bulanStr) {
        const months = {
          '01': 'Januari', '1': 'Januari',
          '02': 'Februari', '2': 'Februari',
          '03': 'Maret', '3': 'Maret',
          '04': 'April', '4': 'April',
          '05': 'Mei', '5': 'Mei',
          '06': 'Juni', '6': 'Juni',
          '07': 'Juli', '7': 'Juli',
          '08': 'Agustus', '8': 'Agustus',
          '09': 'September', '9': 'September',
          '10': 'Oktober',
          '11': 'November',
          '12': 'Desember'
        };
        return months[bulanStr] || bulanStr;
      }

      function getYearGroups(data) {
        const yearMap = {};
        data.forEach(item => {
          const year = String(item.tahun || new Date(item.tanggal || Date.now()).getFullYear());
          if (!yearMap[year]) yearMap[year] = [];
          yearMap[year].push(item);
        });

        return Object.keys(yearMap)
          .sort((a, b) => Number(b) - Number(a))
          .map(year => ({
            year: Number(year),
            items: yearMap[year].sort((a, b) => {
              const dateA = new Date(a.tanggal || 0).getTime();
              const dateB = new Date(b.tanggal || 0).getTime();
              return dateB - dateA;
            })
          }));
      }

      function updateYearPaginationControls(groups) {
        const prevBtn = document.getElementById('btn-prev-year');
        const nextBtn = document.getElementById('btn-next-year');
        const textEl = document.getElementById('text-year-page');
        const totalPages = Math.max(groups.length, 1);

        if (currentYearPage < 1) currentYearPage = 1;
        if (currentYearPage > totalPages) currentYearPage = totalPages;

        if (groups.length === 0) {
          if (textEl) textEl.textContent = 'Tidak ada data';
          if (prevBtn) prevBtn.disabled = true;
          if (nextBtn) nextBtn.disabled = true;
          return;
        }

        const currentGroup = groups[currentYearPage - 1];
        if (textEl) textEl.textContent = `Tahun ${currentGroup.year} • Halaman ${currentYearPage}/${totalPages}`;
        if (prevBtn) prevBtn.disabled = currentYearPage === 1;
        if (nextBtn) nextBtn.disabled = currentYearPage === totalPages;
      }

      window.changeYearPage = function(step) {
        const searchVal = document.getElementById('search-jadwal').value.toLowerCase();
        const filtered = allPastSchedules.filter(s => !searchVal || (s.sekolah || '').toLowerCase().includes(searchVal));
        const groups = getYearGroups(filtered);
        const totalPages = Math.max(groups.length, 1);

        currentYearPage += step;
        if (currentYearPage < 1) currentYearPage = 1;
        if (currentYearPage > totalPages) currentYearPage = totalPages;

        renderTable();
      };

      window.renderTable = function() {
        const searchVal = document.getElementById('search-jadwal').value.toLowerCase();
        const filtered = allPastSchedules.filter(s => !searchVal || (s.sekolah || '').toLowerCase().includes(searchVal));
        const groups = getYearGroups(filtered);
        const totalPages = Math.max(groups.length, 1);

        if (currentYearPage < 1) currentYearPage = 1;
        if (currentYearPage > totalPages) currentYearPage = totalPages;

        updateYearPaginationControls(groups);

        if (groups.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 20px; color: var(--text-muted);">Tidak ada jadwal terlaksana.</td></tr>';
          return;
        }

        const currentGroup = groups[currentYearPage - 1];

        tbody.innerHTML = currentGroup.items.map(s => {
          const koord = s.koordinat || cachedKoordMap[s.sekolah] || '';
          const lokasiBtn = koord
            ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(koord)}" target="_blank"
                   title="Lihat lokasi di Google Maps"
                   style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border:1px solid var(--primary-color);color:var(--primary-color);border-radius:20px;font-size:0.85rem;text-decoration:none;">
                  &#x1F4CD; Lokasi
                 </a>`
            : '-';
          const fotoBtn = s.laporan
            ? `<button onclick="showFotoKegiatan('${(s.laporan || '').replace(/'/g, "\\'")}')"
                   title="Lihat Foto Kegiatan"
                   style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border:1px solid #10b981;color:#10b981;border-radius:20px;font-size:0.85rem;background:none;cursor:pointer;transition:all 0.2s;">
                  <i class="fa-solid fa-images"></i> Lihat Foto
                 </button>`
            : '-';

          const bulanTahun = s.bulan && s.tahun ? `${formatBulan(s.bulan)} ${s.tahun}` : '-';

          return `
            <tr style="border-bottom: 1px solid #eee;">
              <td style="padding: 12px;"><b>${bulanTahun}</b></td>
              <td style="padding: 12px;">${s.tanggal || '-'}</td>
              <td style="padding: 12px;">${s.sekolah || '-'}</td>
              <td style="padding: 12px; text-align: center;">${lokasiBtn}</td>
              <td style="padding: 12px; text-align: center;">${fotoBtn}</td>
            </tr>
          `;
        }).join('');
      };

      document.getElementById('btn-prev-year').addEventListener('click', () => changeYearPage(-1));
      document.getElementById('btn-next-year').addEventListener('click', () => changeYearPage(1));

      // Tampilkan seketika jika ada cache
      if (cachedSchedules && cachedSchedules.length > 0) {
        allPastSchedules = cachedSchedules.filter(s => s.keterangan === 'Terlaksana').sort((a, b) => {
          const dateA = new Date(a.tanggal || 0).getTime();
          const dateB = new Date(b.tanggal || 0).getTime();
          return dateB - dateA;
        });
        currentYearPage = 1;
        renderTable();
      }

      // Refresh data via API agar up-to-date
      fetchAPI('getSchedules', {}).then(jdwRes => {
        let updated = false;

        if (jdwRes && jdwRes.status === 'success' && jdwRes.data) {
          localStorage.setItem('mktas_schedules', JSON.stringify(jdwRes.data));
          allPastSchedules = jdwRes.data.filter(s => s.keterangan === 'Terlaksana').sort((a, b) => {
            const dateA = new Date(a.tanggal || 0).getTime();
            const dateB = new Date(b.tanggal || 0).getTime();
            return dateB - dateA;
          });
          currentYearPage = 1;
          updated = true;
        }

        if (updated || (!cachedSchedules || cachedSchedules.length === 0)) {
           renderTable();
        }
      }).catch(err => {
        console.error('Failed to load schedules:', err);
      });

      window.showFotoKegiatan = function(fotoStr) {
        const container = document.getElementById('foto-kegiatan-container');
        container.innerHTML = '';
        if (fotoStr) {
          const fotos = fotoStr.split(',').map(u => u.trim()).filter(u => u);
          fotos.forEach(url => {
            const img = document.createElement('img');
            img.src = url;
            img.style.maxWidth = '100%';
            img.style.height = 'auto';
            img.style.borderRadius = '8px';
            img.style.objectFit = 'contain';
            img.style.maxHeight = '400px';
            container.appendChild(img);
          });
        } else {
          container.innerHTML = '<p>Tidak ada foto.</p>';
        }
        document.getElementById('modal-foto-kegiatan').style.display = 'block';
      };

      // Load Socials (Footer)
      const socRes = await fetchAPI('getSocials', {});
      const socContainer = document.getElementById('social-container');
      if (socRes.status === 'success' && socRes.data && socRes.data.length > 0) {
        socContainer.innerHTML = socRes.data.map(s => `
            <a href="${s.url}" target="_blank" title="${s.platform}"><i class="${s.icon || 'fa-solid fa-link'}"></i></a>
          `).join('');
      }
      // --- SCROLL TO TOP LOGIC ---
      window.addEventListener('scroll', function() {
        const btn = document.getElementById('btn-scroll-top');
        if (btn) {
          if (window.scrollY > 300) {
            btn.classList.add('show');
          } else {
            btn.classList.remove('show');
          }
        }
      });
      window.scrollToTop = function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
    });
  </script>
